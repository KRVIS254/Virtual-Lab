            <p class="desc">The Devices and Digital IC Lab is a core part of the electronics curriculum, aimed at providing students with both theoretical understanding and practical hands-on experience in working with analog devices and digital integrated circuits. In this lab, students will study the characteristics and applications of PN junction diodes, Zener diodes, DC regulators, and rectifier circuits to gain insights into the fundamentals of power supplies and voltage regulation. They will also perform experiments on clipping circuits, BJT, and MOSFET characteristics to understand signal shaping, amplification, and switching behavior. On the digital front, students will work with binary adders, encoders, decoders, multiplexers, and demultiplexers, thereby developing a strong foundation in combinational logic design and its applications in real-world electronic systems. This lab emphasizes a balanced approach where students verify theoretical principles through experiments, and simultaneously acquire the practical skills necessary to design, construct, and troubleshoot both analog and digital circuits effectively.</p></div>`;

            content = `<p class="desc">
               A PN junction diode is a two-terminal semiconductor device formed by joining a p-type and an n-type semiconductor. At equilibrium, a depletion region forms at the junction, acting as a potential barrier that prevents further carrier diffusion. When an external voltage is applied:<br><br>

<b>Forward Bias:</b><br>
               In forward bias, the P side is connected to the positive terminal and the N side to the negative terminal. The depletion layer narrows, allowing charge carriers to cross the junction easily, so current flows through the diode.<br><br>
<b>Reverse Bias:</b><br>
               In reverse bias, the P side is connected to the negative terminal and the N side to the positive terminal. The depletion layer widens, resistance increases, and almost no current flows until breakdown occurs.<br><br>
<b>The ideal diode equation is:</b><br>
               <b>I = Is(e<sup>V/(nVt)</sup> − 1)</b><br>
where Is is the saturation current, V is the applied voltage, Vt is the thermal voltage (~25 mV at room temperature), and n is the ideality factor.<br><br>
<b>Circuit Diagram:</b><br>
<img src="pn.png" alt="PN Junction Circuit" width="800">
</p>`;
}

Sum = A B̅ + A̅ B = A xor B<br>

<b>Logic Diagram:</b><br>

AND,OR and EX-OR gates..The sum and carry outputs of a full adder can be expressed as:<br>
Sum = A ⊕ B ⊕ Cin<br>
Carry = AB + BCin + ACin<br>
               
<b>Logic Diagram:</b><br>

A decoder is a combinational logic circuit that converts binary information from <i>n</i> input lines to a maximum of 2ⁿ unique output lines.  
For a 3:8 decoder, there are 3 input lines and 8 output lines.

<b>Halfwave Rectifier:</b><br>

              A rectifier is an electronic device that changes alternating current (AC) into direct current (DC). In a half-wave rectifier, only one diode is used. During the positive half cycle of the AC signal, the diode conducts and allows current to pass through the load, producing an output. During the negative half cycle, the diode blocks the current, and the output becomes zero. To make the output smoother, a capacitor is connected as a filter. The capacitor charges during the positive half cycle and slowly discharges when the input voltage drops, reducing the fluctuations in the output. This produces a smoother DC voltage with small ripples instead of sharp pulses.<br>
<b>Circuit Diagram:</b><br>
<img src="hwave.png" alt="Binary Adders" width="600"><br>

<b>Fullwave Rectifier:</b><br>
A practical half wave rectifier with a resistive load is shown in the circuit diagram. It consists of two 
half wave rectifiers connected to a common load. One rectifies during positive half cycle of the input 
and the other rectifying the negative half cycle. The transformer supplies the two diodes (D1 and D2) 
with sinusoidal input voltages that are equal in magnitude but opposite in phase. During input positive 
half cycle, diode D1 is ON and diode D2 is OFF. During negative half cycle D1 is OFF and diode D2 
is ON. Peak Inverse Voltage (PIV) is the maximum voltage that has to be withstand by a diode when 
it is reverse biased. Peak inverse voltage for Full Wave Rectifier is 2Vm because the entire secondary 
voltage appears across the non-conducting diode.<br>
               
<b>Circuit Diagram:</b><br>
<img src="fwave.png" alt="Binary Adders" width="600">
</p>`;

        <h3>Operating Regions</h3>

        <h4>1. Cutoff Region (OFF state)</h4>
        <ul>
          <li><b>Condition:</b> V<sub>GS</sub> &lt; V<sub>th</sub></li>
          <li>No channel is formed, drain current is nearly zero.</li>

    <div style="color:black; font-size:16px;">
        <p>A Bipolar Junction Transistor (BJT) is a three-terminal, current-controlled device. In the **Common Emitter (CE)** configuration, the emitter is common to both the input (Base-Emitter) and output (Collector-Emitter) circuits. This configuration is widely used for **voltage amplification**.</p>
        
        <h3>Key BJT Parameters and Formulas</h3>
<ul style="font-size:16px; color:black;">
  <li><b>Current Relationship:</b> The emitter current (I<sub>E</sub>) is the sum of the collector current (I<sub>C</sub>) and the base current (I<sub>B</sub>):<br>
      <b>I<sub>E</sub> = I<sub>C</sub> + I<sub>B</sub></b>
  </li>
  
  <li><b>Current Gain (&beta;):</b> The DC current gain is the ratio of collector current to base current in the Active region:<br>
      <b>&beta;<sub>DC</sub> = I<sub>C</sub> / I<sub>B</sub></b>
  </li>
  
  <li><b>Active Region Collector Current (with Early Effect):</b><br>

      Where V<sub>A</sub> is the <b>Early Voltage</b>.
  </li>
  
  <li><b>Input (Base) Current (Diode Model):</b><br>
